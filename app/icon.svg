<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" fill="#050505"/>

  <!-- Subtle grid lines -->
  <line x1="16" y1="0" x2="16" y2="32" stroke="#00FFFF" stroke-width="0.15" stroke-opacity="0.15"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="#00FFFF" stroke-width="0.15" stroke-opacity="0.15"/>

  <!-- Corner brackets -->
  <path d="M3 3 L3 7 M3 3 L7 3" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="square" stroke-opacity="0.6"/>
  <path d="M29 3 L29 7 M29 3 L25 3" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="square" stroke-opacity="0.6"/>
  <path d="M3 29 L3 25 M3 29 L7 29" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="square" stroke-opacity="0.6"/>
  <path d="M29 29 L29 25 M29 29 L25 29" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="square" stroke-opacity="0.6"/>

  <!-- W glyph -->
  <path d="M6 9 L10 23 L16 14 L22 23 L26 9" stroke="#00FFFF" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

  <!-- Glow layer (blurred W) -->
